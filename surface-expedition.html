<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#080f13">
<title>诡秘地海 · 地表地图</title>
<link rel="stylesheet" href="map.css"><link rel="stylesheet" href="surface.css"><link rel="stylesheet" href="expedition.css">
</head>
<body>
<main class="atlas surface" id="atlas" aria-label="地表地图">
  <div class="ambient" aria-hidden="true"></div>
  <div class="viewport" id="viewport" tabindex="0" role="region" aria-label="地表地图画布，可拖拽，滚轮或双指缩放，Home 键复位">
    <img class="map-image" id="map-image" src="assets/surface-v1-4k.webp" alt="诡秘地海地表：黑墙、神骸、远征铁路与巨坑" draggable="false">
    <div class="expedition-overlay" id="expedition-overlay" aria-label="远征地点与异空间节点"><svg class="expedition-routes" id="expedition-routes" width="4096" height="4096" viewBox="0 0 4096 4096" aria-hidden="true"></svg></div>
  </div>
  <div class="frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <header class="masthead chrome">
    <span class="eyebrow"><span class="small-rule"></span> THE SURFACE</span>
    <h1>诡秘地海</h1>
    <div class="subtitle"><span>地表</span><span class="divider"></span><span>巨坑远征区</span></div>
    <nav class="layer-switch" aria-label="地图层级"><a href="index.html">地海世界</a><a href="surface-expedition.html" aria-current="page">巨坑远征</a><a href="surface.html">全球地表</a></nav>
  </header>
  <button type="button" class="visibility icon-button" id="toggle-ui" title="隐藏界面（H）" aria-label="隐藏界面" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 8V4h4M17 4h4v4M21 16v4h-4M7 20H3v-4M8 12h8"/></svg></button>
  <nav class="tools chrome" aria-label="地图视图工具">
    <button class="icon-button" id="zoom-in" type="button" title="放大（+）" aria-label="放大地图"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    <span class="zoom-readout" id="zoom-readout" aria-label="当前相对适配缩放">100%</span>
    <button class="icon-button" id="zoom-out" type="button" title="缩小（−）" aria-label="缩小地图"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14"/></svg></button>
    <span class="tool-rule"></span>
    <button class="icon-button" id="fit" type="button" title="完整地图（Home）" aria-label="适配窗口，显示完整地图"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 3H3v6M15 3h6v6M21 15v6h-6M9 21H3v-6M3 3l6 6m12-6-6 6m6 12-6-6M3 21l6-6"/></svg></button>
    <button class="icon-button" id="fullscreen" type="button" title="全屏（F）" aria-label="进入全屏"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M21 16v5h-5M8 21H3v-5"/></svg></button>
    <a class="icon-button" href="assets/surface-v1-4k.webp" download="诡秘地海-地表地图.webp" title="下载地表地图" aria-label="下载地表地图"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></svg></a>
  </nav>
  <div class="expedition-actions chrome"><button type="button" id="expedition-lines" aria-pressed="false">显示航路</button><button type="button" id="expedition-route">查找路线</button><button type="button" id="expedition-list">地点目录</button></div>
  <div class="expedition-routing chrome" id="expedition-routing" hidden><span id="expedition-routing-text">从当前位置选择目的地</span><button type="button" id="expedition-route-clear">结束</button></div>
  <section class="expedition-card chrome" id="expedition-card" hidden aria-label="地点详情"><button type="button" class="expedition-close" id="expedition-card-close" aria-label="关闭地点详情">×</button><header><img id="expedition-card-icon" alt=""><div><small id="expedition-card-category"></small><h2 id="expedition-card-title"></h2></div></header><div id="expedition-card-body"></div><div class="expedition-trip" id="expedition-trip" hidden><p id="expedition-trip-summary"></p><button type="button" id="expedition-trip-go" disabled>出发</button></div></section>
  <section class="expedition-directory chrome" id="expedition-directory" hidden aria-label="地点目录"><header><h2>地点目录</h2><button type="button" class="expedition-close" id="expedition-directory-close" aria-label="关闭地点目录">×</button></header><div id="expedition-directory-body"></div></section>
  <a class="surface-back chrome" href="surface.html" aria-label="返回全球地表地图">‹ 全球地表</a>
  <div class="player-position chrome" id="player-position" aria-live="polite">当前位置：位置未载入</div>
  <div class="loading" id="loading" role="status"><span class="loading-ornament">✧</span><p>正在展开地表地图</p><small>THE SURFACE</small></div>
  <div class="notice" id="notice" role="status" hidden></div>
</main>
<script src="map-discovery-data.js"></script><script src="chart-fog.js"></script><script src="expedition-data.js"></script>
<script src="map-runtime.js"></script><script src="expedition.js"></script>
<script src="map.js"></script>
</body>
</html>
